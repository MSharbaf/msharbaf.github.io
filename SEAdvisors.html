ر هادی تابع الحجه","username":"p013","password":"demo013","capPhd":0,"firstPhd":false,"capSw":1,"firstSw":true,"capDs":0,"firstDs":false}],"students":[{"id":"s1","name":"دانشجوی 1","username":"s001","password":"demo001","degree":"phd"},{"id":"s2","name":"دانشجوی 2","username":"s002","password":"demo002","degree":"phd"},{"id":"s3","name":"دانشجوی 3","username":"s003","password":"demo003","degree":"phd"},{"id":"s4","name":"دانشجوی 4","username":"s004","password":"demo004","degree":"phd"},{"id":"s5","name":"دانشجوی 5","username":"s005","password":"demo005","degree":"phd"},{"id":"s6","name":"دانشجوی 6","username":"s006","password":"demo006","degree":"phd"},{"id":"s7","name":"دانشجوی 7","username":"s007","password":"demo007","degree":"phd"},{"id":"s8","name":"دانشجوی 8","username":"s008","password":"demo008","degree":"phd"},{"id":"s9","name":"دانشجوی 9","username":"s009","password":"demo009","degree":"phd"}],"admin":{"username":"admin1405","password":"admin1405"},"requests":[],"settings":{"phd":2,"ms_sw":0,"ms_ds":0}};

const clone=x=>JSON.parse(JSON.stringify(x));
const DEGREES=['phd','ms_sw','ms_ds'];
const degreeName=d=>({phd:'دکتری مهندسی نرم‌افزار',ms_sw:'ارشد مهندسی نرم‌افزار',ms_ds:'ارشد علم داده'})[d]||'نامشخص';
const capOf=(p,d)=>Number(p?.[({phd:'capPhd',ms_sw:'capSw',ms_ds:'capDs'})[d]])||0;
const firstOf=(p,d)=>p?.[({phd:'firstPhd',ms_sw:'firstSw',ms_ds:'firstDs'})[d]]===true;
const secondOf=(p,d)=>{const k=({phd:'secondPhd',ms_sw:'secondSw',ms_ds:'secondDs'})[d];return typeof p?.[k]==='boolean'?p[k]:!firstOf(p,d)};
const roleOf=(p,d)=>firstOf(p,d)?(secondOf(p,d)?'both':'first'):'second';
const roleLabel=(p,d)=>roleOf(p,d)==='both'?'اول و دوم':roleOf(p,d)==='first'?'فقط اول':'فقط دوم';
function normalize(data){
 data.professors.forEach(p=>{if(p.capPhd===undefined)p.capPhd=Number(p.cap)||0;if(p.firstPhd===undefined)p.firstPhd=p.first===true;if(p.capSw===undefined)p.capSw=Number(p.capMaster)||0;if(p.firstSw===undefined)p.firstSw=p.firstMaster===true;if(p.capDs===undefined)p.capDs=0;if(p.firstDs===undefined)p.firstDs=false;});
 data.students.forEach(s=>{if(!s.degree)s.degree='phd';if(s.degree==='master')s.degree='ms_sw'});
 data.requests.forEach(r=>{if(!r.degree)r.degree='phd';if(r.degree==='master')r.degree='ms_sw'});
 if(!data.settings)data.settings={};for(const d of DEGREES){if(data.settings[d]===undefined)data.settings[d]=2;}if(!data.settings.selectionStartsAt)data.settings.selectionStartsAt={phd:null,ms_sw:null,ms_ds:null};if(!data.settings.selectionDeadlines)data.settings.selectionDeadlines={phd:null,ms_sw:null,ms_ds:null};return data;
}

let db=normalize(clone(INITIAL)),session=null,flash='',sourceInfo='داده‌ها به صورت مشترک در Supabase ذخیره می‌شوند.',revision=0,credentials=loadStoredCredentials(),busy=false;
function loadStoredCredentials(){try{const raw=sessionStorage.getItem('advisorPortalCredentials');if(!raw)return null;const c=JSON.parse(raw);return c&&typeof c.username==='string'&&typeof c.password==='string'?c:null}catch(_){return null}}
function storeCredentials(){try{if(credentials)sessionStorage.setItem('advisorPortalCredentials',JSON.stringify(credentials));else sessionStorage.removeItem('advisorPortalCredentials')}catch(_){/* storage may be unavailable; current tab session still works */}}
async function rpc(action='read',data=null){
 if(!credentials)throw Error('ابتدا وارد سامانه شوید');
 const response=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/advisor_access',{
 method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
 body:JSON.stringify({p_username:credentials.username,p_password:credentials.password,p_action:action,p_revision:action==='write'?revision:null,p_data:data})});
 const result=await response.json();if(!response.ok)throw Error(result.message||'ارتباط با پایگاه داده ناموفق بود');return result;
}
async function refresh(){const result=await rpc();db=normalize(result.data);revision=result.revision;session={role:result.role,id:result.id};render()}
async function save(){
 if(busy){message('خطا: عملیات قبلی هنوز در حال ذخیره است');return false;}
 busy=true;
 try{const result=await rpc('write',db);revision=result.revision;const fresh=await rpc('read');db=normalize(fresh.data);revision=fresh.revision;return true}
 catch(e){alert('ذخیره انجام نشد: '+e.message);try{await refresh()}catch(_){}return false}
 finally{busy=false}
}
async function initialize(){if(credentials){try{await refresh();return}catch(e){credentials=null;session=null;storeCredentials();flash='نشست قبلی معتبر نبود؛ لطفاً دوباره وارد شوید.'}}render()}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const pof=id=>db.professors.find(x=>x.id===id),sof=id=>db.students.find(x=>x.id===id);
const allocations=r=>r.mode==='single'?[{id:r.first,share:1}]:[{id:r.first,share:.5},{id:r.second,share:.5}];
const used=(id,d)=>db.requests.filter(r=>r.status==='approved'&&r.degree===d).flatMap(allocations).filter(a=>a.id===id).reduce((a,b)=>a+b.share,0);
const free=(id,d)=>Math.max(0,capOf(pof(id)||{},d)-used(id,d));
const singleCount=d=>db.requests.filter(r=>r.degree===d&&r.status==='approved'&&r.mode==='single').length;
const pendingSingle=d=>db.requests.filter(r=>r.degree===d&&r.status==='pending'&&r.mode==='single').length;
const singleLimit=d=>Number(db.settings[d]);
const degreeRuleKey=d=>d==='phd'?'rulesPhd':'rulesMaster';
const rulesFor=d=>String(db.settings?.[degreeRuleKey(d)]||'').trim();
const selectionStart=d=>db.settings?.selectionStartsAt?.[d]||'';
const selectionDeadline=d=>db.settings?.selectionDeadlines?.[d]||'';
const selectionNotOpen=d=>!!selectionStart(d)&&Date.now()<new Date(selectionStart(d)).getTime();
const selectionIsClosed=d=>!!selectionDeadline(d)&&Date.now()>=new Date(selectionDeadline(d)).getTime();
const localDateTimeValue=v=>{if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return '';const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
const deadlineFa=d=>selectionDeadline(d)?dateFa(selectionDeadline(d)):'بدون مهلت (فرآیند باز است)';
const active=id=>db.requests.find(r=>r.student===id&&r.status!=='rejected'&&r.status!=='cancelled');
const stamp=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const dateFa=v=>{if(!v)return 'ثبت نشده';const d=new Date(v);return Number.isNaN(d.getTime())?'ثبت نشده':d.toLocaleString('fa-IR',{dateStyle:'short',timeStyle:'short'});};
const canStudentCancel=r=>r?.status==='pending'&&r.createdAt&&Date.now()>=new Date(r.createdAt).getTime()+48*60*60*1000;
const cancelDeadlineText=r=>{if(!r?.createdAt)return 'زمان ثبت درخواست در دسترس نیست';const left=48*60*60*1000-(Date.now()-new Date(r.createdAt).getTime());if(left<=0)return 'مهلت ۴۸ ساعته سپری شده است؛ اکنون می‌توانید درخواست را لغو کنید.';const h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000);return `امکان لغو پس از پایان ۴۸ ساعت؛ زمان باقی‌مانده: ${fa(h)} ساعت و ${fa(m)} دقیقه.`};
const requestExtra=r=>`<div class="request-extra">${r.description?`<div><b>توضیحات دانشجو:</b> ${esc(r.description)}</div>`:''}<div><b>رزومه:</b> <a href="${esc(r.resumeUrl||'#')}" target="_blank" rel="noopener noreferrer">${esc(r.resumeUrl||'ثبت نشده')}</a></div></div>`;
function message(s){flash=s;render()}
function notice(){const x=flash;flash='';return x?`<div class="notice ${x.startsWith('خطا')?'error':'success'}">${esc(x)}</div>`:''}
function rejectedNames(r){return (r.rejections||[]).map(id=>pof(id)?.name||'استاد حذف‌شده').join('، ')}
function rejectionNote(r){return (r.rejections||[]).length?`<span class="warn">رد توسط: ${esc(rejectedNames(r))}</span>`:''}

async function login(){
 const username=$('#username').value.trim(),password=$('#password').value;
 if(!username||!password)return message('خطا: نام کاربری و رمز عبور را وارد کنید.');
 credentials={username,password};

function capacityTable(d){return `<div class="tablewrap"><table><thead><tr><th>استاد</th><th>توضیحات</th><th>ظرفیت</th><th>مصرف‌شده</th><th>باقی‌مانده</th>${session?.role==='admin'?'<th>درخواست‌های معلق</th>':''}</tr></thead><tbody>${db.professors.filter(p=>capOf(p,d)>0).map(p=>`<tr><td>${esc(p.name)}</td><td>${roleLabel(p,d)}</td><td>${fa(capOf(p,d))}</td><td>${fa(used(p.id,d))}</td><td>${fa(free(p.id,d))}</td>${session?.role==='admin'?`<td><span class="pill pending">${fa(db.requests.filter(r=>r.degree===d&&r.status==='pending'&&(r.first===p.id||r.second===p.id)).length)}</span></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function selectProf(role,d){const list=db.professors.filter(p=>capOf(p,d)>0&&(role==='first'?firstOf(p,d):secondOf(p,d)));return `<select id="${role}"><option value="">انتخاب استاد</option>${list.map(p=>`<option value="${esc(p.id)}" ${free(p.id,d)<(role==='first'?.5:.5)?'disabled':''}>${esc(p.name)} (آزاد: ${fa(free(p.id,d))})</option>`).join('')}</select>`}
function studentAssignmentStatus(s){
 const history=db.requests.filter(r=>r.student===s.id);
 const approved=history.filter(r=>r.status==='approved');
 const pending=history.filter(r=>r.status==='pending');
 const r=approved.at(-1)||pending.at(-1)||history.at(-1);
 if(!r)return '<span class="pill">بدون درخواست</span>';
 const first=esc(pof(r.first)?.name||'استاد نامشخص');
 const second=r.second?esc(pof(r.second)?.name||'استاد نامشخص'):null;
 const names=`<div class="student-advisors">راهنمای اول: ${first}${second?`<br>راهنمای دوم: ${second}`:''}</div>`;
 if(r.status==='approved')return `<span class="pill approved">تخصیص قطعی</span>${names}`;
 if(r.status==='pending')return `<span class="pill pending">درخواست معلق</span>${names}`;
 if(r.status==='rejected')return `<span class="pill rejected">درخواست رد شده</span>${names}${rejectionNote(r)}`;

async function send(){let d=sof(session.id).degree;if(selectionNotOpen(d))return message('خطا: هنوز زمان شروع انتخاب استاد فرا نرسیده است.');if(selectionIsClosed(d))return message('خطا: مهلت انتخاب استاد به پایان رسیده و فرآیند ثبت درخواست بسته شده است.');let mode=$('input[name=mode]:checked').value,first=$('#first').value,second=mode==='joint'?$('#second').value:null,description=$('#requestDescription').value.trim(),resumeUrl=$('#resumeUrl').value.trim();if(active(session.id))return message('خطا: درخواست فعال دارید.');try{const u=new URL(resumeUrl);if(!['http:','https:'].includes(u.protocol))throw Error()}catch(_){return message('خطا: لینک رزومه معتبر و با http یا https وارد کنید.')}if(!firstOf(pof(first)||{},d)||mode==='joint'&&(!pof(second)||!secondOf(pof(second),d)||first===second))return message('خطا: ترکیب استادان مجاز نیست.');if(mode==='single'&&singleCount(d)+pendingSingle(d)>=singleLimit(d))return message('خطا: سقف درخواست انفرادی این رشته پر است.');if(free(first,d)<(mode==='single'?1:.5)||mode==='joint'&&free(second,d)<.5)return message('خطا: ظرفیت کافی وجود ندارد.');db.requests.push({id:stamp(),student:session.id,degree:d,mode,first,second,description,resumeUrl,status:'pending',approvals:[],rejections:[]});if(await save())message('درخواست ثبت شد.');}
async function action(type,id){let r=db.requests.find(r=>r.id===id),pid=session.id,d=r?.degree;if(!r||!allocations(r).some(a=>a.id===pid))return message('خطا: عملیات مجاز نیست.');if(type==='reject'&&(r.status==='pending'||r.status==='rejected')&&!(r.rejections||[]).includes(pid)&&!r.approvals.includes(pid)){(r.rejections??=[]).push(pid);r.status='rejected';if(await save())message('رد درخواست توسط '+pof(pid).name+' ثبت شد.');return}if(r.status!=='pending'||r.approvals.includes(pid))return message('خطا: عملیات مجاز نیست.');if(allocations(r).some(a=>free(a.id,d)<a.share)||r.mode==='single'&&singleCount(d)>=singleLimit(d))return message('خطا: ظرفیت کافی برای تأیید وجود ندارد.');r.approvals.push(pid);if(allocations(r).every(a=>r.approvals.includes(a.id)))r.status='approved';if(await save())message(r.status==='approved'?'درخواست نهایی شد و ظرفیت کسر شد.':'تأیید شما ثبت شد؛ منتظر استاد دیگر است.');}
async function cancel(id){let r=db.requests.find(r=>r.id===id);if(!r)return;if(session?.role==='student'&&!canStudentCancel(r))return message('لغو درخواست فقط پس از گذشت ۴۸ ساعت از زمان ارسال امکان‌پذیر است.');if(!confirm('این درخواست لغو شود؟'))return;r.status='cancelled';if(await save())message('درخواست لغو شد و ظرفیت آزاد شد.')}
async function saveSettings(e){e.preventDefault();let v=clone(db.settings||{});for(const d of DEGREES){v[d]=Number($('#limit_'+d).value);if(!Number.isInteger(v[d])||v[d]<0||v[d]>1000)return message('خطا: سقف انفرادی باید عدد صحیح غیرمنفی باشد.');if(v[d]<singleCount(d)+pendingSingle(d))return message('خطا: سقف جدید کمتر از تعداد درخواست‌های انفرادی فعال است.')}db.settings=v;if(await save())message('تنظیمات ذخیره شد.');}
async function saveProcessSettings(e){e.preventDefault();let deadlines={},starts={};for(const d of DEGREES){const startRaw=$('#start_'+d).value,endRaw=$('#deadline_'+d).value;starts[d]=startRaw?new Date(startRaw).toISOString():null;deadlines[d]=endRaw?new Date(endRaw).toISOString():null;if(starts[d]&&deadlines[d]&&new Date(starts[d])>=new Date(deadlines[d]))return message('خطا: زمان شروع باید قبل از زمان پایان باشد ('+degreeName(d)+').');}db.settings={...(db.settings||{}),selectionStartsAt:starts,selectionDeadlines:deadlines,rulesPhd:$('#rulesPhd').value.trim(),rulesMaster:$('#rulesMaster').value.trim()};if(await save())message('زمان شروع و پایان انتخاب و قوانین با موفقیت ذخیره شدند.');}
async function saveProf(e){e.preventDefault();let id=$('#profId').value,name=$('#profName').value.trim(),username=$('#profUser').value.trim(),password=$('#profPass').value;let caps={},firsts={},seconds={};for(const d of DEGREES){caps[d]=Number($('#cap_'+d).value);const role=$('#first_'+d).value;firsts[d]=role!=='second';seconds[d]=role!=='first'}if(!name||!username||!password||!usernameAvailable(username,'prof',id))return message('خطا: اطلاعات ناقص یا نام کاربری تکراری است.');if(DEGREES.some(d=>!Number.isFinite(caps[d])||caps[d]<0||caps[d]*2%1!==0))return message('خطا: ظرفیت نامعتبر است.');if(id){for(const d of DEGREES){if(caps[d]<used(id,d))return message('خطا: ظرفیت جدید از ظرفیت مصرف‌شده کمتر است.');if(db.requests.some(r=>r.degree===d&&['pending','approved'].includes(r.status)&&r.first===id)&&!firsts[d])return message('خطا: استاد در این رشته راهنمای اول درخواست فعال است.');if(db.requests.some(r=>r.degree===d&&['pending','approved'].includes(r.status)&&r.second===id)&&!seconds[d])return message('خطا: استاد در این رشته راهنمای دوم درخواست فعال است.')}}let p=id?pof(id):null,fields={name,username,password,capPhd:caps.phd,firstPhd:firsts.phd,capSw:caps.ms_sw,firstSw:firsts.ms_sw,capDs:caps.ms_ds,firstDs:firsts.ms_ds,secondPhd:seconds.phd,secondSw:seconds.ms_sw,secondDs:seconds.ms_ds};if(p)Object.assign(p,fields);else db.professors.push({id:stamp(),...fields});if(await save())message('اطلاعات استاد ذخیره شد.');}

async function saveStudent(e){e.preventDefault();let id=$('#studentId').value,name=$('#studentName').value.trim(),degree=$('#studentDegree').value,username=$('#studentUser').value.trim(),password=$('#studentPass').value;if(!name||!username||!password||!DEGREES.includes(degree)||!usernameAvailable(username,'student',id))return message('خطا: اطلاعات ناقص یا نام کاربری تکراری است.');if(id&&db.requests.some(r=>r.student===id&&['pending','approved'].includes(r.status)&&r.degree!==degree))return message('خطا: ابتدا درخواست فعال دانشجو را لغو کنید.');let s=id?sof(id):null;if(s)Object.assign(s,{name,degree,username,password});else db.students.push({id:stamp(),name,degree,username,password});if(await save())message('اطلاعات دانشجو ذخیره شد.');}
async function deletePerson(role,id){let prof=role==='prof',list=prof?db.professors:db.students,linked=db.requests.some(r=>prof?allocations(r).some(a=>a.id===id):r.student===id);if(linked)return message('خطا: این حساب سابقه درخواست دارد؛ برای حفظ سوابق قابل حذف نیست.');if(!confirm('حساب حذف شود؟'))return;db[prof?'professors':'students']=list.filter(x=>x.id!==id);await save();message('حساب حذف شد.')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='graduate-advisors-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
let stagedStudents=[];let cancelEligibilityTimer=null;let selectionWindowTimer=null;
function normalizeDegreeInput(v){let s=String(v??'').trim().toLowerCase().replace(/[\u200c\u200f\u200e]/g,' ').replace(/\s+/g,' ');return ({phd:'phd',doctorate:'phd','دکتری':'phd','دکتری مهندسی نرم افزار':'phd',ms_sw:'ms_sw',master_sw:'ms_sw','ارشد نرم افزار':'ms_sw','ارشد مهندسی نرم افزار':'ms_sw','کارشناسی ارشد نرم افزار':'ms_sw',ms_ds:'ms_ds',master_ds:'ms_ds','ارشد علم داده':'ms_ds','کارشناسی ارشد علم داده':'ms_ds','علم داده':'ms_ds'})[s]||null}
function importCell(v){return String(v??'').trim()}
function parseCSV(raw){let rows=[],row=[],cell='',quoted=false;raw=raw.replace(/^\ufeff/,'');for(let i=0;i<raw.length;i++){let c=raw[i];if(c==='"'){if(quoted&&raw[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(quoted)throw Error('علامت نقل‌قول در CSV بسته نشده است.');return rows}
function normalizeStudentRows(rows){if(!rows.length)throw Error('فایل خالی است.');const aliases={name:['name','نام','نام دانشجو','نام و نام خانوادگی'],degree:['degree','رشته','مقطع','رشته / مقطع'],username:['username','نام کاربری','نام‌کاربری'],password:['password','رمز عبور','رمز']};let h=rows[0].map(v=>importCell(v).toLowerCase());let ix={};for(const [key,names] of Object.entries(aliases))ix[key]=h.findIndex(x=>names.includes(x));if(Object.values(ix).some(v=>v<0))throw Error('سرستون‌ها یافت نشد. از فایل الگو استفاده کنید.');let existing=new Set([db.admin.username,...db.students.map(s=>s.username),...db.professors.map(p=>p.username)]);let seen=new Set();return rows.slice(1).filter(r=>r.some(v=>importCell(v))).map((r,i)=>{let name=importCell(r[ix.name]),degreeRaw=importCell(r[ix.degree]),degree=normalizeDegreeInput(degreeRaw),username=importCell(r[ix.username]),password=importCell(r[ix.password]);let errors=[];if(!name||name.length>120)errors.push('نام نامعتبر');if(!degree)errors.push('رشته نامعتبر');if(!username||username.length>60)errors.push('نام کاربری نامعتبر');if(!password||password.length>120)errors.push('رمز عبور نامعتبر');if(existing.has(username))errors.push('نام کاربری موجود');if(seen.has(username))errors.push('نام کاربری تکراری در فایل');seen.add(username);return {line:i+2,name,degree,degreeRaw,username,password,errors}})}
function displayStudentImport(rows){let el=$('#studentImportPreview'),good=rows.filter(x=>!x.errors.length),bad=rows.filter(x=>x.errors.length);stagedStudents=rows;$('#confirmStudentImport').disabled=!good.length||!!bad.length;el.innerHTML=`<p><b>${fa(rows.length)}</b> ردیف | <span class="import-good">${fa(good.length)} معتبر</span> | <span class="import-error">${fa(bad.length)} دارای خطا</span></p><div class="tablewrap import-preview"><table><thead><tr><th>ردیف</th><th>نام</th><th>رشته</th><th>نام کاربری</th><th>وضعیت</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fa(r.line)}</td><td>${esc(r.name)}</td><td>${esc(degreeName(r.degree)||r.degreeRaw)}</td><td><code>${esc(r.username)}</code></td><td class="${r.errors.length?'import-error':'import-good'}">${r.errors.length?esc(r.errors.join('، ')):'معتبر'}</td></tr>`).join('')}</tbody></table></div><p class="muted">برای جلوگیری از ثبت ناقص، تا زمانی که خطاهای فایل رفع نشوند دکمه ثبت فعال نمی‌شود.</p>`}
async function importStudentFile(file){stagedStudents=[];$('#confirmStudentImport').disabled=true;if(!file)return;try{let rows;if(file.name.toLowerCase().endsWith('.csv'))rows=parseCSV(await file.text());else if(/\.xlsx?$/.test(file.name.toLowerCase())){if(typeof XLSX==='undefined')throw Error('کتابخانه خواندن اکسل بارگذاری نشده است. اتصال اینترنت را بررسی کنید یا فایل را به CSV تبدیل کنید.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}else throw Error('فرمت فایل باید XLSX یا CSV باشد.');let data=normalizeStudentRows(rows);if(data.length>1000)throw Error('حداکثر ۱۰۰۰ دانشجو در هر نوبت مجاز است.');displayStudentImport(data)}catch(e){$('#studentImportPreview').textContent='خطا: '+e.message}}
function downloadStudentTemplate(){let csv='\ufeffname,degree,username,password\r\n"دانشجوی نمونه ارشد نرم افزار",ms_sw,example_sw_001,pass001\r\n"دانشجوی نمونه ارشد علم داده",ms_ds,example_ds_001,pass002\r\n"دانشجوی نمونه دکتری",phd,example_phd_001,pass003\r\n';let a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='student_import_template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function commitStudentImport(){let valid=stagedStudents.filter(r=>!r.errors.length);if(!valid.length||valid.length!==stagedStudents.length)return message('ابتدا خطاهای فایل را رفع کنید.');if(!confirm(`${valid.length} دانشجو به سامانه افزوده شوند؟`))return;let usernames=new Set([db.admin.username,...db.students.map(s=>s.username),...db.professors.map(p=>p.username)]);if(valid.some(r=>usernames.has(r.username)))return message('اطلاعات کاربران تغییر کرده است؛ فایل را دوباره بررسی کنید.');let before=clone(db.students);valid.forEach(r=>db.students.push({id:stamp()+'_'+Math.random().toString(36).slice(2,8),name:r.name,degree:r.degree,username:r.username,password:r.password}));if(await save()){stagedStudents=[];message(`${valid.length} دانشجو با موفقیت ثبت شدند.`)}else{db.students=before;message('ثبت گروهی انجام نشد؛ دوباره تلاش کنید.')}}
function wirePasswordToggles(){$$('.toggle-pass').forEach(b=>b.onclick=()=>{let field=document.getElementById(b.dataset.target);if(!field)return;let show=field.type==='password';field.type=show?'text':'password';b.textContent=show?'🙈':'👁';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'پنهان کردن رمز عبور':'نمایش رمز عبور');b.title=show?'پنهان کردن رمز عبور':'نمایش رمز عبور'})}
function render(){const app=$('#app');let label=session?.role==='admin'?'مدیر گروه':session?.role==='prof'?pof(session.id)?.name:sof(session?.id)?.name;app.innerHTML=notice()+(session?`<div class="spaced card"><strong>${esc(label)}</strong><button id="logout" class="secondary">خروج</button></div>${session.role==='admin'?adminView():session.role==='prof'?profView():studentView()}`:`<div class="card login"><h2>ورود به سامانه</h2><label>نام کاربری<input id="username" dir="ltr" autocomplete="username"></label><label>رمز عبور<input id="password" type="password" dir="ltr" autocomplete="current-password"></label><button id="login">ورود</button></div>`);
if(cancelEligibilityTimer)clearTimeout(cancelEligibilityTimer);if(selectionWindowTimer)clearTimeout(selectionWindowTimer);if(session?.role==='student'){const pendingRequest=active(session.id);if(pendingRequest?.status==='pending'&&pendingRequest.createdAt&&!canStudentCancel(pendingRequest)){const wait=Math.max(1000,new Date(pendingRequest.createdAt).getTime()+48*60*60*1000-Date.now()+250);cancelEligibilityTimer=setTimeout(()=>{if(session?.role==='student')render()},wait)}const studentDegree=sof(session.id)?.degree||'phd';const boundaries=[selectionStart(studentDegree),selectionDeadline(studentDegree)].map(v=>v?new Date(v).getTime():0).filter(t=>t>Date.now()).sort((a,b)=>a-b);if(boundaries.length){const wait=Math.max(1000,Math.min(2147483000,boundaries[0]-Date.now()+500));selectionWindowTimer=setTimeout(()=>{if(session?.role==='student')render()},wait)}}wirePasswordToggles();if(!session){$('#login').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};return}$('#logout').onclick=()=>{session=null;credentials=null;storeCredentials();render()};if(session.role==='student'){if($('#send')){const syncMode=()=>{let joint=$('input[name=mode]:checked').value==='joint';$('#secondWrap').classList.toggle('hidden',!joint);const d=sof(session.id).degree;$$('#first option').forEach(o=>{if(o.value)o.disabled=free(o.value,d)<(joint?.5:1)});if($('#first').selectedOptions[0]?.disabled)$('#first').value=''};$$('input[name=mode]').forEach(el=>el.onchange=syncMode);syncMode();$('#send').onclick=send}if($('#cancel'))$('#cancel').onclick=()=>cancel(active(session.id).id)}
if(session.role==='prof')$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));
if(session.role==='admin'){$('#settingsForm').onsubmit=saveSettings;$('#processSettingsForm').onsubmit=saveProcessSettings;$('#profForm').onsubmit=saveProf;$('#studentForm').onsubmit=saveStudent;$('#clearProf').onclick=()=>{$('#profForm').reset();$('#profId').value=''};$('#clearStudent').onclick=()=>{$('#studentForm').reset();$('#studentId').value=''};
$$('[data-editprof]').forEach(b=>b.onclick=()=>{let p=pof(b.dataset.editprof);$('#profId').value=p.id;$('#profName').value=p.name;DEGREES.forEach(d=>{$('#cap_'+d).value=capOf(p,d);$('#first_'+d).value=roleOf(p,d)});$('#profUser').value=p.username;$('#profPass').value=p.password;$('#profForm').scrollIntoView({behavior:'smooth'})});
$$('[data-editstudent]').forEach(b=>b.onclick=()=>{let s=sof(b.dataset.editstudent);$('#studentId').value=s.id;$('#studentName').value=s.name;$('#studentDegree').value=s.degree||'phd';$('#studentUser').value=s.username;$('#studentPass').value=s.password;$('#studentForm').scrollIntoView({behavior:'smooth'})});
$$('[data-delprof]').forEach(b=>b.onclick=()=>deletePerson('prof',b.dataset.delprof));$$('[data-delstudent]').forEach(b=>b.onclick=()=>deletePerson('student',b.dataset.delstudent));$$('[data-cancelreq]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancelreq));$('#refreshServer').onclick=async()=>{try{await refresh();message('اطلاعات به‌روز شد.')}catch(e){message('خطا: '+e.message)}};
$('#openAllAdminLists').onclick=()=>$$('.admin-list').forEach(x=>x.open=true);$('#closeAllAdminLists').onclick=()=>$$('.admin-list').forEach(x=>x.open=false);$('#export').onclick=exportData;$('#downloadStudentTemplate').onclick=downloadStudentTemplate;$('#studentImportFile').onchange=e=>importStudentFile(e.target.files[0]);$('#confirmStudentImport').onclick=commitStudentImport;$('#clearStudentImport').onclick=()=>{stagedStudents=[];$('#studentImportFile').value='';$('#studentImportPreview').textContent='هنوز فایلی انتخاب نشده است.';$('#confirmStudentImport').disabled=true};
$('#adminForm').onsubmit=async e=>{e.preventDefault();let u=$('#adminUser').value.trim(),p=$('#adminPass').value;if(!u||!p||!usernameAvailable(u,'admin','admin'))return message('خطا: نام کاربری تکراری یا نامعتبر است.');db.admin={username:u,password:p};if(await save()){credentials={username:u,password:p};storeCredentials();message('حساب مدیر ذخیره شد.')}};}}
